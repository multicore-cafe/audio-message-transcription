# Host directory for MCP exports; the same value is mounted and reported by the tools.
x-export-host-dir: &export-host-dir ${MCP_EXPORT_HOST_DIR:-${PWD}/exports}

services:
  bot:
    build: .
    image: transcription-bot
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    # Named volume: Docker creates it owned by the image's user, so it is writable on the first run.
    volumes:
      - bot-data:/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Read-only Telegram MCP server for AI clients, started only on request:
  # `docker compose --profile mcp up -d` (or `docker compose up -d mcp`).
  # It has its own Telegram session in its own volume and never sees the bot's session.
  mcp:
    profiles: ["mcp"]
    build: .
    image: transcription-bot
    command: ["telegram-mcp", "serve"]
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8790"
      MCP_EXPORT_DIR: /exports
      MCP_EXPORT_HOST_DIR: *export-host-dir
    ports:
      # Loopback only.
      - "127.0.0.1:${MCP_PORT:-8790}:8790"
    volumes:
      - mcp-data:/data
      # Must already exist (`mkdir -p exports`), so Docker never creates it as root.
      - type: bind
        source: *export-host-dir
        target: /exports
        bind:
          create_host_path: false
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bot-data:
  mcp-data:
