services:
  bot:
    build: .
    image: transcription-bot
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    # The host directory must be writable by this uid (1000 by default).
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    volumes:
      - ./data:/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
