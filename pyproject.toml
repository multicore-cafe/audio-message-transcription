[project]
name = "transcription-bot"
version = "0.2.0"
description = "Telegram userbot that transcribes the owner's voice messages with OpenAI"
authors = [{ name = "kana", email = "andrew4chrome@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.45,<1.46",  # guard.py is reviewed against this minor version (see tests/test_mcp_guard.py)
    "openai>=2.9",
    "python-dotenv>=1.2",
    "mcp>=2.3,<3",
]

[project.scripts]
transcription-bot = "transcription_bot.__main__:main"
telegram-mcp = "transcription_bot.mcp_server.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
